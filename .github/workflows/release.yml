name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      - name: Verify tag matches flake.nix version
        run: |
          FLAKE_VERSION=$(grep -m1 'version = "' flake.nix | sed 's/.*"\(.*\)".*/\1/')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$FLAKE_VERSION" != "$TAG_VERSION" ]; then
            echo "error: tag $GITHUB_REF_NAME does not match flake.nix version $FLAKE_VERSION"
            exit 1
          fi

      - name: Compile binary
        run: deno task compile

      - name: Ad-hoc codesign
        run: codesign -s - --force herdr-mcp

      - id: meta
        name: Set version metadata
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Pack release tarball
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          COPYFILE_DISABLE: 1
        run: |
          ASSET="herdr-mcp-${VERSION}-aarch64-apple-darwin.tar.gz"
          tar czf "$ASSET" herdr-mcp
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      - name: Compute SHA-256
        run: |
          SHA256=$(shasum -a 256 "$ASSET" | awk '{print $1}')
          echo "SHA-256: $SHA256"

      - name: Create GitHub release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          files: ${{ env.ASSET }}
          generate_release_notes: true
          fail_on_unmatched_files: true
