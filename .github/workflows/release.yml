name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write

    outputs:
      version: ${{ steps.meta.outputs.version }}
      sha256: ${{ steps.sha.outputs.sha256 }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      - name: Verify tag matches flake.nix version
        run: |
          FLAKE_VERSION=$(grep -m1 'version = "' flake.nix | sed 's/.*"\(.*\)".*/\1/')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$FLAKE_VERSION" != "$TAG_VERSION" ]; then
            echo "error: tag $GITHUB_REF_NAME does not match flake.nix version $FLAKE_VERSION"
            exit 1
          fi

      - name: Compile binary
        run: deno task compile

      - name: Ad-hoc codesign
        run: codesign -s - --force herdr-mcp

      - id: meta
        name: Set version metadata
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Pack release tarball
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          COPYFILE_DISABLE: 1
        run: |
          ASSET="herdr-mcp-${VERSION}-aarch64-apple-darwin.tar.gz"
          tar czf "$ASSET" herdr-mcp
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      - id: sha
        name: Compute SHA-256
        run: |
          SHA256=$(shasum -a 256 "$ASSET" | awk '{print $1}')
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "SHA-256: $SHA256"

      - name: Create GitHub release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          files: ${{ env.ASSET }}
          generate_release_notes: true
          fail_on_unmatched_files: true

  tap-bump:
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Require HOMEBREW_TAP_TOKEN
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not set. Add a PAT with contents:write on boozedog/homebrew-tap."
            exit 1
          fi

      - name: Bump Formula in boozedog/homebrew-tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
          SHA256: ${{ needs.release.outputs.sha256 }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/boozedog/homebrew-tap.git" tap
          cd tap
          FORMULA="Formula/herdr-mcp.rb"
          if [ ! -f "$FORMULA" ]; then
            echo "::error::$FORMULA not found in boozedog/homebrew-tap"
            exit 1
          fi
          sed -i.bak -E "s/^(  version )\"[0-9]+\.[0-9]+\.[0-9]+[^\"]*\"/\1\"${VERSION}\"/" "$FORMULA"
          sed -i.bak -E "s/^(  sha256 )\"[a-f0-9]{64}\"/\1\"${SHA256}\"/" "$FORMULA"
          rm -f "$FORMULA.bak"
          if ! grep -q "version \"${VERSION}\"" "$FORMULA"; then
            echo "::error::Formula version was not updated to ${VERSION}"
            exit 1
          fi
          if ! grep -q "sha256 \"${SHA256}\"" "$FORMULA"; then
            echo "::error::Formula sha256 was not updated to ${SHA256}"
            exit 1
          fi
          if git diff --quiet -- "$FORMULA"; then
            echo "Formula already at version ${VERSION} with matching sha256"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FORMULA"
          git commit -m "bump herdr-mcp to ${VERSION}"
          git push origin HEAD
